name: FloodGuard CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  EB_APPLICATION: FloodGuard
  EB_ENVIRONMENT: FloodGuard-Prod
  EB_SOURCE_BUCKET: ddac-floodguard

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: floodguard_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql+pymysql://root:rootpass@127.0.0.1:3306/floodguard_ci
      SECRET_KEY: ci-only-secret-key
      SENSOR_INGESTION_TOKEN: ci-only-device-token
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      AWS_SESSION_TOKEN: ci
      AWS_EC2_METADATA_DISABLED: "true"

      S3_BUCKET_NAME: ddac-floodguard
      S3_ORIGINAL_PREFIX: original/
      S3_OPTIMIZED_PREFIX: optimized/
      S3_PRESIGNED_URL_EXPIRES_SECONDS: "900"

      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:ci
      SQS_SENSOR_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/ci
      BROADCAST_API_URL: https://example.invalid/broadcast
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: |
          pip install pytest
          pip install -r lambda/optimize_report_image/requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile backend
        run: |
          python -m compileall -q backend

      - name: Import FastAPI application
        working-directory: backend
        run: |
          python -c "import main; print('FastAPI import OK')"

      - name: Verify one Alembic head
        working-directory: backend
        run: |
          python -m alembic heads
          HEAD_COUNT=$(python -m alembic heads | grep -c "(head)")
          echo "Alembic head count: $HEAD_COUNT"

          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "ERROR: Alembic must have exactly one head."
            exit 1
          fi

      - name: Test migrations on MySQL
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: "/"
        run: npm run build

      - name: Build Elastic Beanstalk source bundle
        run: |
          rm -rf deploy/ci-eb-build
          mkdir -p deploy/ci-eb-build/backend
          mkdir -p deploy/ci-eb-build/frontend

          rsync -a \
            --exclude "venv" \
            --exclude ".env" \
            --exclude "__pycache__" \
            --exclude ".pytest_cache" \
            backend/ deploy/ci-eb-build/backend/

          cp -r frontend/dist deploy/ci-eb-build/frontend/dist
          cp backend/Procfile deploy/ci-eb-build/Procfile
          cp backend/requirements.txt deploy/ci-eb-build/requirements.txt
          cp -r .ebextensions deploy/ci-eb-build/.ebextensions

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path("deploy/ci-eb-build")
          output = Path("deploy/floodguard-eb.zip")

          if output.exists():
              output.unlink()

          with ZipFile(output, "w", ZIP_DEFLATED) as zf:
              for path in source.rglob("*"):
                  if path.is_file():
                      zf.write(path, path.relative_to(source).as_posix())

          with ZipFile(output) as zf:
              names = zf.namelist()

          required = [
              "Procfile",
              "requirements.txt",
              ".ebextensions/db-migrate.config",
              "backend/main.py",
              "frontend/dist/index.html",
          ]

          missing = [name for name in required if name not in names]
          bad = [name for name in names if "\\" in name]

          if missing:
              raise SystemExit(f"Missing EB files: {missing}")

          if bad:
              raise SystemExit(f"Invalid Windows ZIP paths: {bad}")

          print(f"Elastic Beanstalk bundle OK: {len(names)} entries")
          PY

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: elastic-beanstalk-bundle
          path: deploy/floodguard-eb.zip
          if-no-files-found: error

  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: ci

    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Download deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: elastic-beanstalk-bundle
          path: deploy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create Elastic Beanstalk application version
        id: version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="gh-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          KEY="deployments/floodguard-${VERSION}.zip"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

          aws s3 cp \
            deploy/floodguard-eb.zip \
            "s3://${EB_SOURCE_BUCKET}/${KEY}"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION" \
            --description "GitHub Actions ${GITHUB_SHA}" \
            --source-bundle "S3Bucket=${EB_SOURCE_BUCKET},S3Key=${KEY}" \
            --process

          for attempt in {1..30}; do
            STATUS=$(aws elasticbeanstalk describe-application-versions \
              --application-name "$EB_APPLICATION" \
              --version-labels "$VERSION" \
              --query "ApplicationVersions[0].Status" \
              --output text)

            echo "Application version status: $STATUS"

            if [ "$STATUS" = "PROCESSED" ]; then
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ]; then
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for application version processing."
          exit 1

      - name: Deploy application
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "${{ steps.version.outputs.version }}"

          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_ENVIRONMENT"

      - name: Verify deployed version
        run: |
          RUNNING_VERSION=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query "Environments[0].VersionLabel" \
            --output text)

          echo "Expected: ${{ steps.version.outputs.version }}"
          echo "Running:  $RUNNING_VERSION"

          if [ "$RUNNING_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: Elastic Beanstalk did not keep the new version."
            exit 1
          fi

      - name: Production health check
        shell: bash
        run: |
          CNAME=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query "Environments[0].CNAME" \
            --output text)

          echo "Testing HTTP redirect:"
          echo "http://${CNAME}/health"

          REDIRECT_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/health-redirect.txt \
            --write-out "%{http_code}" \
            "http://${CNAME}/health" || true)

          echo "HTTP redirect status: ${REDIRECT_CODE}"

          if [ "$REDIRECT_CODE" != "301" ] && [ "$REDIRECT_CODE" != "308" ]; then
            echo "ERROR: Expected HTTP 301 or 308 redirect from the Elastic Beanstalk hostname."
            cat /tmp/health-redirect.txt || true
            exit 1
          fi

          HTTPS_HEALTH_URL="https://sunitanepali.com.np/health"
          echo "Testing HTTPS health:"
          echo "${HTTPS_HEALTH_URL}"

          for attempt in {1..20}; do
            CODE=$(curl \
              --silent \
              --show-error \
              --output /tmp/health-https.txt \
              --write-out "%{http_code}" \
              "${HTTPS_HEALTH_URL}" || true)

            echo "Attempt ${attempt}: HTTP ${CODE}"

            if [ "$CODE" = "200" ]; then
              cat /tmp/health-https.txt
              echo "Production HTTPS health check passed."
              exit 0
            fi

            sleep 10
          done

          echo "Production HTTPS health check failed."
          cat /tmp/health-https.txt || true
          exit 1
